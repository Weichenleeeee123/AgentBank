services:
  public:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AGENTBANK_ENV: public
      AGENTBANK_SCHEDULER_ENABLED: "true"
      AGENTBANK_SCHEDULER_INTERVAL_SECONDS: "30"
      AGENTBANK_DATABASE_URL: sqlite:////data/public.db
      AGENTBANK_SESSION_SECRET: ${PUBLIC_SESSION_SECRET:?set PUBLIC_SESSION_SECRET}
      AGENTBANK_AUDIT_SECRET: ${PUBLIC_AUDIT_SECRET:?set PUBLIC_AUDIT_SECRET}
      AGENTBANK_ADMIN_TOKEN: ""
      AGENTBANK_STAFF_TOKEN: ""
      AGENTBANK_LLM_PRIMARY_BASE_URL: ${AGENTBANK_LLM_PRIMARY_BASE_URL:-}
      AGENTBANK_LLM_PRIMARY_API_KEY: ${AGENTBANK_LLM_PRIMARY_API_KEY:-}
      AGENTBANK_LLM_PRIMARY_MODEL: ${AGENTBANK_LLM_PRIMARY_MODEL:-}
      AGENTBANK_LLM_PRIMARY_TIMEOUT_SECONDS: ${AGENTBANK_LLM_PRIMARY_TIMEOUT_SECONDS:-4}
      AGENTBANK_LLM_BACKUP_BASE_URL: ${AGENTBANK_LLM_BACKUP_BASE_URL:-}
      AGENTBANK_LLM_BACKUP_API_KEY: ${AGENTBANK_LLM_BACKUP_API_KEY:-}
      AGENTBANK_LLM_BACKUP_MODEL: ${AGENTBANK_LLM_BACKUP_MODEL:-}
      AGENTBANK_LLM_BACKUP_TIMEOUT_SECONDS: ${AGENTBANK_LLM_BACKUP_TIMEOUT_SECONDS:-4}
    volumes:
      - public_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  eval:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AGENTBANK_ENV: eval
      AGENTBANK_SCHEDULER_ENABLED: "true"
      AGENTBANK_SCHEDULER_INTERVAL_SECONDS: "5"
      AGENTBANK_DATABASE_URL: sqlite:////data/eval.db
      AGENTBANK_SESSION_SECRET: ${EVAL_SESSION_SECRET:?set EVAL_SESSION_SECRET}
      AGENTBANK_AUDIT_SECRET: ${EVAL_AUDIT_SECRET:?set EVAL_AUDIT_SECRET}
      AGENTBANK_ADMIN_TOKEN: ${EVAL_ADMIN_TOKEN:?set EVAL_ADMIN_TOKEN}
      AGENTBANK_STAFF_TOKEN: ${EVAL_STAFF_TOKEN:?set EVAL_STAFF_TOKEN}
      AGENTBANK_LLM_PRIMARY_BASE_URL: ${AGENTBANK_LLM_PRIMARY_BASE_URL:-}
      AGENTBANK_LLM_PRIMARY_API_KEY: ${AGENTBANK_LLM_PRIMARY_API_KEY:-}
      AGENTBANK_LLM_PRIMARY_MODEL: ${AGENTBANK_LLM_PRIMARY_MODEL:-}
      AGENTBANK_LLM_PRIMARY_TIMEOUT_SECONDS: ${AGENTBANK_LLM_PRIMARY_TIMEOUT_SECONDS:-4}
      AGENTBANK_LLM_BACKUP_BASE_URL: ${AGENTBANK_LLM_BACKUP_BASE_URL:-}
      AGENTBANK_LLM_BACKUP_API_KEY: ${AGENTBANK_LLM_BACKUP_API_KEY:-}
      AGENTBANK_LLM_BACKUP_MODEL: ${AGENTBANK_LLM_BACKUP_MODEL:-}
      AGENTBANK_LLM_BACKUP_TIMEOUT_SECONDS: ${AGENTBANK_LLM_BACKUP_TIMEOUT_SECONDS:-4}
    volumes:
      - eval_data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  public_data:
  eval_data:
