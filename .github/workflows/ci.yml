name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the push range, which can include older parent commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Full local release gates
        run: python scripts/release.py --package
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-evidence
          path: |
            .tmp/releases/**/gates.json
            .tmp/releases/**/check-*.txt
            .tmp/releases/**/eval-cases.json
            .tmp/releases/**/http-self-test.json
            .tmp/releases/**/manifest.json
            .tmp/releases/**/agentbank-m4-source.zip
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -f deploy/Dockerfile .
