name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check backend
      - run: python -m mypy backend/agentbank
      - run: python -m pytest
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -f deploy/Dockerfile .
      - name: Frontend smoke
        run: python -c "from pathlib import Path; assert Path('frontend/index.html').exists(); assert Path('frontend/app.js').exists()"
