<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工接管</title><link rel="stylesheet" href="/app/styles.css"><meta name="theme-color" content="#2563d9"><link rel="icon" type="image/png" href="/app/icon-192.png"></head>
<body class="staff-page tool-page"><main class="shell"><header><h1>人工接管工作台</h1></header><p class="status">坐席可查看上下文、记录处理结果；付款仍须用户在 App 重新授权。</p>
