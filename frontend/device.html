<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app/styles.css"><title>模拟手机</title><meta name="theme-color" content="#2563d9"><link rel="icon" type="image/png" href="/app/icon-192.png"></head><body class="device-page tool-page"><main class="shell"><header><div><span class="eyebrow">SIMULATED DEVICE</span><h1>模拟手机 OTP</h1></div></header><form id="device" class="composer"><input id="token" type="password" autocomplete="off" placeholder="设备令牌"><button>读取消息</button></form><form id="pair" class="composer"><input id="pairCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="管理员提供的一次性配对码" required><button>配对模拟设备</button></form><pre id="messages" class="bubble"></pre></main><script type="module">document.getElementById('device').onsubmit=async e=>{e.preventDefault();const r=await fetch('/device/v1/inbox',{headers:{'X-Device-Token':document.getElementById('token').value}});document.getElementById('messages').textContent=JSON.stringify(await r.json(),null,2)};document.getElementById('pair').onsubmit=async e=>{e.preventDefault();const r=await fetch('/device/v1/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pairing_code:document.getElementById('pairCode').value})});const data=await r.json();document.getElementById('pairCode').value='';if(r.ok){document.getElementById('token').value=data.device_token;document.getElementById('messages').textContent='设备已配对。令牌仅保存在当前设备页面。';}else{document.getElementById('messages').textContent=data.code||'配对失败';}}</script></body></html>
