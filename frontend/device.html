<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app/styles.css"><title>模拟手机</title></head><body><main class="shell"><header><div><span class="eyebrow">SIMULATED DEVICE</span><h1>模拟手机 OTP</h1></div></header><form id="device" class="composer"><input id="token" placeholder="设备令牌"><button>读取消息</button></form><pre id="messages" class="bubble"></pre></main><script type="module">document.getElementById('device').onsubmit=async e=>{e.preventDefault();const r=await fetch('/device/v1/inbox',{headers:{'X-Device-Token':document.getElementById('token').value}});document.getElementById('messages').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
