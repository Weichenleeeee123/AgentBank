<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563d9" />
  <link rel="icon" type="image/png" href="/app/icon-192.png" />
  <link rel="manifest" href="/app/manifest.json" />
  <link rel="stylesheet" href="/app/styles.css" />
  <title>AgentBank</title>
</head>
<body class="app-page">
  <main class="shell">
    <header><div><span class="eyebrow">AGENTBANK</span><h1>你的银行智能体</h1></div><div class="header-actions"><a class="ghost-link" href="/app/webim.html">模拟 IM</a><a class="ghost-link" href="/app/plan.html">计划</a><button id="balanceBtn" class="ghost">查余额</button><button id="pinButton" class="ghost">修改 PIN</button></div></header>
    <section class="account-bar" aria-label="演示账户"><label for="userSelect">演示账户</label><select id="userSelect"><option value="user_001">user_001 · 主账户</option><option value="user_002">user_002 · 备用账户</option></select><button id="switchUser" class="ghost">切换</button></section>
    <div class="app-layout">
    <aside id="services" class="operations-column" aria-label="业务操作">
    <section class="direct-forms" aria-label="银行服务表单">
      <fieldset id="queryMode" class="segmented">
        <legend>查询</legend>
        <label><input type="radio" name="queryMode" value="balance" checked /><span>余额</span></label>
        <label><input type="radio" name="queryMode" value="transactions" /><span>交易</span></label>
      </fieldset>
      <form id="queryForm" class="form-grid">
        <div id="transactionFilters" class="filter-grid" hidden>
          <label>开始日期<input id="startDate" name="start_date" type="date" /></label>
          <label>结束日期<input id="endDate" name="end_date" type="date" /></label>
          <label>类别<input id="categoryFilter" name="category" autocomplete="off" placeholder="全部类别" /></label>
          <label>条数<select id="transactionLimit" name="limit"><option value="10">10 条</option><option value="25">25 条</option><option value="50" selected>50 条</option><option value="100">100 条</option></select></label>
        </div>
        <div class="form-submit"><span id="queryStatus" class="form-status" aria-live="polite"></span><button type="submit">查询</button></div>
      </form>
      <fieldset id="transferMode" class="segmented">
        <legend>转账方式</legend>
        <label><input type="radio" name="transferMode" value="name" checked /><span>姓名</span></label>
        <label><input type="radio" name="transferMode" value="phone" /><span>手机号</span></label>
        <label><input type="radio" name="transferMode" value="alias" /><span>别名</span></label>
      </fieldset>
      <form id="transferForm" class="form-grid">
        <div class="transfer-grid">
          <label id="recipientNameField">收款人姓名<input id="recipientName" name="recipient_name" autocomplete="name" required /></label>
          <label id="recipientPhoneField" hidden>收款人手机号<input id="recipientPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" /></label>
          <label id="recipientAliasField" hidden>收款人别名<input id="recipientAlias" name="alias" autocomplete="off" /></label>
          <label>金额（元）<input id="transferAmount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required /></label>
          <label class="memo-field">备注<input id="transferMemo" name="memo" maxlength="80" autocomplete="off" /></label>
        </div>
        <label id="recipientCandidateField" class="candidate-field" hidden>选择收款人<select id="recipientCandidate"><option value="">请选择收款人</option></select></label>
        <div class="form-submit"><span id="transferStatus" class="form-status" aria-live="polite"></span><button type="submit">准备转账</button></div>
      </form>
    </section>
    <p id="offlineNotice" class="form-error" role="status" hidden>当前离线。仅显示静态页面，银行数据不缓存，所有操作需联网。</p>
    <section id="status" class="status">连接模拟银行中…</section>
    <section class="inbox"><div class="section-heading"><h2>通知</h2><button id="refreshNotifications" class="ghost" aria-label="刷新通知">刷新</button></div><div id="notificationList" class="notification-list" aria-live="polite"></div></section>
    </aside>
    <section class="conversation-column" aria-label="银行智能体对话">
    <div class="conversation-heading"><div><span class="eyebrow">BANKING ASSISTANT</span><h2>对话办理</h2></div><a class="mobile-services" href="#services">快捷办理</a><span class="session-mark">本地模拟</span></div>
    <section id="messages" class="messages" aria-live="polite"></section>
    <form id="composer" class="composer"><input id="message" aria-label="发送给银行智能体的消息" autocomplete="off" placeholder="例如：给房东转 20 元，备注房租" /><button>发送</button></form>
    <section class="quick"><button data-text="帮我查一下余额">余额</button><button data-text="帮我查一下订阅">订阅</button><button data-text="推荐理财产品">理财</button><button data-text="先把我的卡冻结">保护卡片</button></section>
    </section>
    </div>
  </main>
  <dialog id="otpDialog" class="otp-dialog" aria-labelledby="otpTitle">
    <form id="otpForm" method="dialog">
      <h2 id="otpTitle">模拟手机验证码</h2>
      <label for="otpCode">验证码</label>
      <input id="otpCode" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
      <div class="card-actions"><button type="button" class="ghost" id="otpCancel">取消</button><button type="submit">验证</button></div>
    </form>
  </dialog>
  <dialog id="pinDialog" class="otp-dialog" aria-labelledby="pinTitle">
    <form id="pinForm">
      <h2 id="pinTitle">修改卡片 PIN</h2>
      <label for="pinCard">当前账户卡片</label><select id="pinCard" required></select>
      <label for="newPin">新 PIN</label>
      <input id="newPin" name="newPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required />
      <label for="confirmPin">再次输入 PIN</label>
      <input id="confirmPin" name="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required />
      <p id="pinError" class="form-error" role="alert"></p>
      <div class="card-actions"><button type="button" class="ghost" id="pinCancel">取消</button><button type="submit">提交安全请求</button></div>
    </form>
  </dialog>
  <script src="/app/app.js" type="module"></script>
</body>
</html>
