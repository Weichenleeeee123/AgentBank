<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app/styles.css"><title>AgentBank 模拟 IM</title><meta name="theme-color" content="#2563d9"><link rel="icon" type="image/png" href="/app/icon-192.png"></head>
<body class="im-page"><main class="shell"><header><div><span class="eyebrow">SIMULATED IM</span><h1>独立 IM 身份体验</h1></div><a class="ghost-link" href="/app/">返回银行 App</a></header>
<p>使用独立 IM 身份连接银行服务。高风险操作回到银行 App 完成验证。</p>
<div class="app-layout im-layout">
<aside class="im-controls" aria-label="IM 连接设置">
<h2>连接设置</h2>
<section class="account-bar"><label for="identity">模拟 IM 身份</label><select id="identity"><option value="demo_im_001">demo_im_001</option><option value="demo_im_002">demo_im_002</option></select><button id="connect" type="button">连接身份</button></section>
<section class="account-bar"><span id="binding">尚未连接</span><button id="bind" type="button" disabled>绑定 App 当前账户</button></section>
<section class="account-bar"><label for="group"><input id="group" type="checkbox">模拟群聊（隐藏敏感信息）</label><button id="newChat" type="button">新建对话</button></section>
<p id="imStatus" class="status" role="status"></p>
</aside>
<section class="conversation-column" aria-label="模拟 IM 对话">
<div class="conversation-heading"><div><span class="eyebrow">AGENTBANK IM</span><h2>消息</h2></div><span class="session-mark">本地模拟</span></div>
<section id="messages" class="messages" aria-live="polite"></section>
<form id="composer" class="composer"><input id="message" aria-label="发送 IM 消息" placeholder="例如：查余额，或给房东转 20 元" autocomplete="off" required><button id="send" disabled>发送</button></form>
<p class="conversation-note">请勿在聊天中发送 PIN 或验证码。</p>
</section></div>
</main><script type="module" src="/app/webim.js"></script></body></html>
