<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app/styles.css"><title>AgentBank 计划</title></head><body><main class="shell"><header><div><span class="eyebrow">PLAN GRAPH</span><h1>计划进度</h1></div></header><form id="load" class="composer"><input id="plan" placeholder="计划 ID"><button>查看</button></form><section id="graph" class="messages"></section></main><script type="module">document.getElementById('load').onsubmit=async e=>{e.preventDefault();const r=await fetch(`/v1/plans/${document.getElementById('plan').value}/graph`,{headers:{Authorization:`Bearer ${localStorage.agentbank_token||''}`}});const data=await r.json();document.getElementById('graph').innerHTML=(data.nodes||[]).map(node=>`<article class="bubble"><h3>${node.logical_id} · ${node.status}</h3><div class="fact"><span>工具</span><strong>${node.tool}</strong></div><div class="fact"><span>授权</span><strong>${node.authorization}</strong></div><div class="fact"><span>规则</span><strong>${node.rule_id||'policy-bound'}</strong></div></article>`).join('')}</script></body></html>
