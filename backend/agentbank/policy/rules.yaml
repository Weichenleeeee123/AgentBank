version: "2026-10-28.1"
assurance_order: [none, confirm, mfa]
tiers: [G, Y, R, D]
rules:
  - id: P01
    description: unauthenticated session is denied
    tier: D
    assurance: none
  - id: P02
    description: resource ownership is required
    tier: D
    assurance: none
  - id: P03
    operations: [account.balance, transactions.query]
    tier: G
    assurance: none
  - id: P05
    operations: [transfer.create]
    condition: projected_today_minor <= 100000
    tier: Y
    assurance: confirm
  - id: P06
    operations: [transfer.create]
    condition: projected_today_minor > 100000
    tier: R
    assurance: mfa
  - id: U03
    description: commit quota recheck and ledger write in one immediate transaction
  - id: U05
    condition: new_recipient == true
    tier: R
    assurance: mfa
  - id: U09
    description: changed parameters invalidate the receipt
  - id: U19
    description: audit failure rejects a commit

  - id: U07
    description: server risk high denies payment and opens handoff
  - id: U08
    description: medium or unknown holds funds for 30 real minutes then requires fresh MFA within 10 minutes
  - id: U16
    description: three OTP failures in ten real minutes lock ordinary writes for fifteen minutes
  - id: U17
    description: three authenticated forgery or ownership violations in thirty real minutes lock ordinary writes
  - id: U18
    description: three infrastructure failures open the tool circuit for sixty real seconds; queries remain available
  - id: U20
    description: untrusted text is data only and cannot supply write parameters
